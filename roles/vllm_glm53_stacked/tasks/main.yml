---
# GLM-5.3-Flash NVFP4 — tonyd2wild sm121 vLLM mp TP=2.

- name: Interconnect IPv4 for GLM-5.3 NCCL master
  ansible.builtin.import_tasks: ../../vllm_stacked_container/tasks/preflight_interconnect.yml

- name: Set GLM-5.3 leader IP and node rank
  ansible.builtin.set_fact:
    spark_glm53_leader_ip: "{{ hostvars[groups['sparks'] | sort | first].spark_interconnect_ip }}"
    spark_glm53_node_rank: "{{ 0 if inventory_hostname == (groups['sparks'] | sort | first) else 1 }}"

- name: Ensure GLM-5.3 install / config / patch directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: "{{ spark_runtime_user | default('nvidia') }}"
    group: "{{ spark_runtime_user | default('nvidia') }}"
  loop:
    - "{{ vllm_glm53_install_dir }}"
    - "{{ vllm_glm53_config_dir }}"
    - "{{ vllm_glm53_patches_host_dir }}"
    - "{{ vllm_glm53_hf_home }}"

- name: Stage SM121 sparse-indexer hotfix onto host
  ansible.builtin.copy:
    src: sparse_attn_indexer_kpool_sm121.py
    dest: "{{ vllm_glm53_patches_host_dir }}/sparse_attn_indexer_kpool.py"
    mode: "0644"

- name: Deploy GLM-5.3 env file
  ansible.builtin.template:
    src: glm53.env.j2
    dest: "{{ vllm_glm53_config_dir }}/glm53-{{ inventory_hostname }}.env"
    mode: "0644"

- name: Deploy GLM-5.3 serve entrypoint
  ansible.builtin.template:
    src: glm53-serve.sh.j2
    dest: "{{ vllm_glm53_config_dir }}/glm53-serve.sh"
    mode: "0755"

- name: Pull GLM-5.3 sm121 vLLM image
  ansible.builtin.command:
    cmd: docker pull {{ vllm_glm53_image }}
  register: vllm_glm53_pull_out
  changed_when: >-
    'Image is up to date' not in (
    (vllm_glm53_pull_out.stdout | default(''))
    ~ (vllm_glm53_pull_out.stderr | default(''))
    )
  when: vllm_glm53_pull_image | bool

- name: Sync disks and drop host page caches before GLM-5.3 serve
  ansible.builtin.shell:
    cmd: sync && echo 3 > /proc/sys/vm/drop_caches
  changed_when: true

- name: Remove GLM-5.3 container when recreating
  ansible.builtin.command:
    cmd: docker rm -f "{{ vllm_glm53_container_name }}"
  failed_when: false
  when: vllm_glm53_recreate | bool

- name: Inspect GLM-5.3 container state
  ansible.builtin.command:
    cmd: docker container inspect -f "{{ '{{' }}json .State.Running{{ '}}' }}" "{{ vllm_glm53_container_name }}"
  register: vllm_glm53_running
  failed_when: false
  changed_when: false

- name: Start stopped GLM-5.3 container
  ansible.builtin.command:
    cmd: docker start "{{ vllm_glm53_container_name }}"
  register: vllm_glm53_docker_start
  when:
    - not (vllm_glm53_recreate | bool)
    - vllm_glm53_running.rc == 0
    - (vllm_glm53_running.stdout | default("") | trim) == "false"
  failed_when: false
  changed_when: vllm_glm53_docker_start.rc == 0

- name: Start GLM-5.3 worker container (rank 1, headless)
  ansible.builtin.shell: |
    set -euo pipefail
    docker run -d --restart unless-stopped \
      --name "{{ vllm_glm53_container_name }}" \
      --entrypoint /bin/bash \
      --network host \
      --ipc host \
      --shm-size "{{ vllm_glm53_shm_size }}" \
      --gpus all \
      {{ ('--device ' + vllm_glm53_rdma_device_path + ' --cap-add IPC_LOCK --ulimit memlock=-1:-1') if (vllm_glm53_rdma_enabled | bool) else '' }} \
      --env-file "{{ vllm_glm53_config_dir }}/glm53-{{ inventory_hostname }}.env" \
      -v "{{ vllm_glm53_hf_home }}:{{ vllm_glm53_hf_container_home }}" \
      -v "{{ vllm_glm53_patches_host_dir }}/sparse_attn_indexer_kpool.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro" \
      -v "{{ vllm_glm53_config_dir }}/glm53-serve.sh:/opt/glm53-serve.sh:ro" \
      "{{ vllm_glm53_image }}" \
      -lc 'exec /bin/bash /opt/glm53-serve.sh'
  args:
    executable: /bin/bash
  when:
    - inventory_hostname != (groups['sparks'] | sort | first)
    - vllm_glm53_recreate | bool
      or vllm_glm53_running.rc != 0
      or (
        (vllm_glm53_running.stdout | default("") | trim) == "false"
        and (
          vllm_glm53_docker_start is not defined
          or vllm_glm53_docker_start.rc != 0
        )
      )

- name: Wait for worker before starting GLM-5.3 leader
  ansible.builtin.pause:
    seconds: 20
  when: inventory_hostname == (groups['sparks'] | sort | first)

- name: Start GLM-5.3 leader container (rank 0, API)
  ansible.builtin.shell: |
    set -euo pipefail
    docker run -d --restart unless-stopped \
      --name "{{ vllm_glm53_container_name }}" \
      --entrypoint /bin/bash \
      --network host \
      --ipc host \
      --shm-size "{{ vllm_glm53_shm_size }}" \
      --gpus all \
      {{ ('--device ' + vllm_glm53_rdma_device_path + ' --cap-add IPC_LOCK --ulimit memlock=-1:-1') if (vllm_glm53_rdma_enabled | bool) else '' }} \
      --env-file "{{ vllm_glm53_config_dir }}/glm53-{{ inventory_hostname }}.env" \
      -v "{{ vllm_glm53_hf_home }}:{{ vllm_glm53_hf_container_home }}" \
      -v "{{ vllm_glm53_patches_host_dir }}/sparse_attn_indexer_kpool.py:/usr/local/lib/python3.12/dist-packages/vllm/model_executor/layers/sparse_attn_indexer_kpool.py:ro" \
      -v "{{ vllm_glm53_config_dir }}/glm53-serve.sh:/opt/glm53-serve.sh:ro" \
      "{{ vllm_glm53_image }}" \
      -lc 'exec /bin/bash /opt/glm53-serve.sh'
  args:
    executable: /bin/bash
  when:
    - inventory_hostname == (groups['sparks'] | sort | first)
    - vllm_glm53_recreate | bool
      or vllm_glm53_running.rc != 0
      or (
        (vllm_glm53_running.stdout | default("") | trim) == "false"
        and (
          vllm_glm53_docker_start is not defined
          or vllm_glm53_docker_start.rc != 0
        )
      )

- name: Wait for GLM-5.3 OpenAI API on leader
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ vllm_glm53_api_port | int }}/health"
    status_code: 200
    timeout: 5
  register: vllm_glm53_api
  retries: "{{ vllm_glm53_api_ready_retries | int }}"
  delay: "{{ vllm_glm53_api_ready_delay_sec | int }}"
  until: vllm_glm53_api.status | default(0) == 200
  when: inventory_hostname == (groups['sparks'] | sort | first)
