---
- name: Reload limits LaunchDaemon
  become: true
  ansible.builtin.shell: |
    set -eu
    /bin/launchctl bootout system "{{ mac_base_limits_plist }}" 2>/dev/null || true
    /bin/launchctl bootstrap system "{{ mac_base_limits_plist }}"
  args:
    executable: /bin/bash
  changed_when: true

- name: Restart mds
  become: true
  ansible.builtin.command: /usr/bin/killall mds
  changed_when: true
  failed_when: false
