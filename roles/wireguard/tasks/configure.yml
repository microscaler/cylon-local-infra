---
- name: Validate WireGuard interface contract
  ansible.builtin.assert:
    that:
      - wireguard_address | length > 0
      - wireguard_peers | length > 0
      - not wireguard_healthcheck_enabled or
        wireguard_healthcheck_peer_public_key | length > 0
    fail_msg: >-
      WireGuard configuration requires an interface address, at least one peer,
      and a required healthcheck peer key when health repair is enabled.
    quiet: true

- name: Read private key for interface template
  ansible.builtin.slurp:
    src: "{{ wireguard_private_key_path }}"
  register: wireguard_config_private_key
  no_log: true
  when: wireguard_private_key_ready.stat.exists

- name: Set private key template fact
  ansible.builtin.set_fact:
    wireguard_private_key: >-
      {{ wireguard_config_private_key.content | b64decode | trim }}
  no_log: true
  when: wireguard_private_key_ready.stat.exists

- name: Use non-secret placeholder private key during first check-mode run
  ansible.builtin.set_fact:
    wireguard_private_key: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
  no_log: true
  when:
    - ansible_check_mode
    - not wireguard_private_key_ready.stat.exists

- name: Configure persistent IPv4 forwarding
  ansible.builtin.copy:
    dest: "{{ wireguard_sysctl_path }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      # Managed by cylon-local-infra :: wireguard
      net.ipv4.ip_forward = 1
      net.ipv4.conf.all.forwarding = 1
      net.ipv4.conf.default.forwarding = 1
      net.ipv4.conf.all.rp_filter = 2
      net.ipv4.conf.default.rp_filter = 2
  register: wireguard_sysctl_config
  when: wireguard_enable_ip_forward | bool

- name: Apply WireGuard forwarding sysctls
  ansible.builtin.command:
    argv:
      - sysctl
      - --system
  changed_when: true
  when:
    - wireguard_enable_ip_forward | bool
    - wireguard_sysctl_config is changed

- name: Install UFW when managing WireGuard listener rule
  ansible.builtin.apt:
    name: ufw
    state: present
  when: wireguard_manage_ufw_rule | bool

- name: Allow WireGuard UDP listener in UFW
  ansible.builtin.command:
    argv:
      - ufw
      - allow
      - "{{ wireguard_listen_port }}/udp"
      - comment
      - Microscaler WireGuard hub
  changed_when: false
  when: wireguard_manage_ufw_rule | bool

- name: Render WireGuard interface configuration
  ansible.builtin.template:
    src: wg0.conf.j2
    dest: "{{ wireguard_config_path }}"
    owner: root
    group: root
    mode: "0600"
  no_log: true
  notify: Restart WireGuard interface

- name: Install WireGuard healthcheck command
  ansible.builtin.copy:
    src: wireguard_healthcheck.py
    dest: "{{ wireguard_healthcheck_executable }}"
    owner: root
    group: root
    mode: "0755"
  when: wireguard_healthcheck_enabled | bool
  notify: Reload WireGuard health timer

- name: Install WireGuard healthcheck service
  ansible.builtin.template:
    src: wireguard-healthcheck.service.j2
    dest: "/etc/systemd/system/{{ wireguard_healthcheck_service_name }}.service"
    owner: root
    group: root
    mode: "0644"
  when: wireguard_healthcheck_enabled | bool
  notify: Reload WireGuard health timer

- name: Install WireGuard healthcheck timer
  ansible.builtin.template:
    src: wireguard-healthcheck.timer.j2
    dest: "/etc/systemd/system/{{ wireguard_healthcheck_service_name }}.timer"
    owner: root
    group: root
    mode: "0644"
  when: wireguard_healthcheck_enabled | bool
  notify: Reload WireGuard health timer

- name: Enable and start WireGuard interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode

- name: Enable and start WireGuard health timer
  ansible.builtin.systemd:
    name: "{{ wireguard_healthcheck_service_name }}.timer"
    enabled: true
    state: started
    daemon_reload: true
  when:
    - wireguard_healthcheck_enabled | bool
    - not ansible_check_mode

- name: Apply pending WireGuard handlers before verification
  ansible.builtin.meta: flush_handlers

- name: Read active WireGuard interface state
  ansible.builtin.command:
    argv:
      - wg
      - show
      - "{{ wireguard_interface }}"
  register: wireguard_active_state
  changed_when: false
  when: not ansible_check_mode

- name: Summarize WireGuard interface
  ansible.builtin.debug:
    msg:
      - "interface: {{ wireguard_interface }} ({{ wireguard_address }})"
      - "listen port: {{ wireguard_listen_port }}/udp"
      - "peers: {{ wireguard_peers | map(attribute='name') | join(', ') }}"
      - >-
        health repair: {{ wireguard_healthcheck_service_name }}.timer
        ({{ 'enabled' if wireguard_healthcheck_enabled else 'disabled' }})
