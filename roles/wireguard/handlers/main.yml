---
- name: Restart WireGuard interface
  ansible.builtin.systemd:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted
    daemon_reload: true
  when: not ansible_check_mode

- name: Reload WireGuard health timer
  ansible.builtin.systemd:
    name: "{{ wireguard_healthcheck_service_name }}.timer"
    state: restarted
    enabled: true
    daemon_reload: true
  when:
    - wireguard_healthcheck_enabled | bool
    - not ansible_check_mode
