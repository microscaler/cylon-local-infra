---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

- name: restart microscaler-dev-dns
  ansible.builtin.systemd:
    name: "{{ dev_dns_unit_name }}"
    state: restarted

- name: restart systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: restarted
