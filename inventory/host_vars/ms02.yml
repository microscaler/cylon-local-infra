---
# Host-specific config for ms02 (Intel desktop dev host — Docker CE, Kind,
# Cursor Remote-SSH target, soon NFSv4 exporter). Defaults from the invoked
# roles apply unless overridden here.

# ── Firewall (ufw) — LAN-only services on ms02 ────────────────────────────
# The base `firewall` role leaves LAN exposure empty by default. Explicitly
# grant the home subnet access to selected TCP ports. Port 445 (SMB) is NOT
# added — see llmwiki/concepts/workspace-mount-protocols.md for why we're
# not picking SMB. SSH (22) is already in firewall_allow_tcp_ports so it's
# universally open; the entries below are LAN-only.
#
# LAN dev access from picolino (and any host on the home /24). SSH-tunneled
# NFS is retired — direct :2049 + this TCP range must work from the Mac.
#
# `firewall_trusted_lan_cidr` covers picolino when it has a 192.168.1.x address
# (Wi-Fi or USB Ethernet to the same switch as ms02). Narrow to a host IP only
# if you intentionally want to exclude other LAN clients.
firewall_trusted_lan_cidr: "192.168.1.0/24"
firewall_trusted_lan_tcp_ports:
  - 22
  - 2049           # NFSv4 (macOS `just nfs-up`; not inside 7000–12000)
  - "7000:12000"   # Tilt (10348), Hermes (9119), Wrangler (8787), nodeports, observability, …
  # Sparks → ms02 push targets (kind extraPortMappings forward kind:NodePort → host).
  # See llmwiki/concepts/sparks-observability-pipeline.md and roles/spark_observability.
  - 3100           # Loki push API (Promtail-on-Spark → ms02:3100/loki/api/v1/push)
  - 4317           # OTLP gRPC (otel-agent-on-Spark → otel-collector in kind)
  - 4318           # OTLP HTTP (alternative; same path)

# Captured from ad-hoc shared-k8s lan_firewall.py / just dev-dns-up (was not in Ansible).
firewall_trusted_lan_udp_ports:
  - 53             # microscaler-dev-dns (dnsmasq)
firewall_trusted_lan_rules:
  - {port: 53, proto: udp, comment: "Microscaler dev DNS (dnsmasq)"}
  - {port: 53, proto: tcp, comment: "Microscaler dev DNS (dnsmasq TCP)"}
  - {port: 80, proto: tcp, comment: "Microscaler dev haproxy HTTP"}
  - {port: 443, proto: tcp, comment: "Microscaler dev haproxy HTTPS"}
  - {port: 6443, proto: tcp, comment: "Microscaler dev Kubernetes API (kubectl from Mac)"}
  - {port: 47984, proto: tcp, comment: "LAN Sunshine HTTPS"}
  - {port: 47989, proto: tcp, comment: "LAN Sunshine control"}
  - {port: 47990, proto: tcp, comment: "LAN Sunshine Web UI"}
  - {port: 48010, proto: tcp, comment: "LAN Sunshine RTSP"}
  - {port: "47998:48000", proto: udp, comment: "LAN Sunshine media"}
  - {port: 48002, proto: udp, comment: "LAN Sunshine microphone"}
  - {port: 48010, proto: udp, comment: "LAN Sunshine video"}

# Remote picolino arrives through WireGuard as 10.77.0.3. Keep this /32 policy
# separate from the broad home-LAN rules.
firewall_trusted_vpn_cidr: "10.77.0.3/32"
firewall_trusted_vpn_tcp_ports:
  - 22
  - 2049
  - "7000:12000"
firewall_trusted_vpn_udp_ports:
  - 53
firewall_trusted_vpn_rules:
  - {port: 53, proto: tcp, comment: "WireGuard dev DNS"}
  - {port: 80, proto: tcp, comment: "WireGuard dev HTTP"}
  - {port: 443, proto: tcp, comment: "WireGuard dev HTTPS"}
  - {port: 6443, proto: tcp, comment: "WireGuard Kubernetes API"}
  - {port: 38839, proto: tcp, comment: "WireGuard shared Kind API"}
  - {port: 47984, proto: tcp, comment: "WireGuard Sunshine HTTPS"}
  - {port: 47989, proto: tcp, comment: "WireGuard Sunshine control"}
  - {port: 47990, proto: tcp, comment: "WireGuard Sunshine Web UI"}
  - {port: 48010, proto: tcp, comment: "WireGuard Sunshine RTSP"}
  - {port: "47998:48000", proto: udp, comment: "WireGuard Sunshine media"}
  - {port: 48002, proto: udp, comment: "WireGuard Sunshine microphone"}
  - {port: 48010, proto: udp, comment: "WireGuard Sunshine video"}

# ── Sunshine/Moonlight remote desktop over LAN or WireGuard ──────────────
# A dedicated Xorg/XFCE session avoids console autologin and works without a
# physical display or dummy plug. Sunshine is available to the trusted home LAN
# and picolino's WireGuard address, but remains blocked from the public internet.
sunshine_remote_desktop_enabled: true
sunshine_remote_desktop_user: casibbald
sunshine_remote_desktop_uid: 1000
sunshine_remote_desktop_width: 2560
sunshine_remote_desktop_height: 1440
sunshine_remote_desktop_refresh_rate: 60

# ── MetalLB / Multipass bridge L3 route (Mac → 10.177.76.0/24 via ms02) ───
# Role: metallb_lan_route. Macs add a matching static route (mac_workstation).
# Exposes the whole MetalLB pool to the home LAN — intentional for desktop-dev.
metallb_lan_route_enabled: true
metallb_lan_route_lan_cidr: "192.168.1.0/24"
metallb_lan_route_bridge_cidr: "10.177.76.0/24"
metallb_lan_route_additional_source_cidrs:
  - "10.77.0.3/32"

# ── Split-horizon dev DNS (was shared-k8s just dev-dns-* / configure_dev_dns.py) ─
dev_dns_enabled: true
dev_dns_lan_ip: "192.168.1.189"

# --- Hermes agent — optional dotenv patch (playbooks/sync_hermes_ms02.yml; cutover --sync-hermes)
# Set `hermes_agent_dotenv_path` to the env file Hermes loads on ms02 (must exist).
# Example (adjust to your checkout):
#   hermes_agent_dotenv_path: "/home/casibbald/Workspace/microscaler/hermes/.env"
# Optional: non-interactive restart after the patch (shell one-liner on ms02):
#   hermes_agent_post_sync_command: "sudo -u casibbald bash -lc 'cd ~/hermes && docker compose restart'"
hermes_agent_dotenv_path: ""
hermes_agent_post_sync_command: ""

# ── HF model cold-store (NFS export at /srv/hf-archive) ────────────────────
# Sparks mount ms02:/srv/hf-archive at /mnt/ms02-hf-archive and hf-prefetch
# downloads NFS-routed models (e.g. MiniMax-M3) straight to ms02 disk.
# Kimi-K2.7-Code stays on GB10 local NVMe + QSFP peer sync.
hf_archive_enabled: true
hf_archive_lan_ip: "192.168.1.189"
hf_archive_ssh_user: casibbald
hf_archive_cache_dir: "/srv/hf-archive/hub"
hf_archive_ssh_from: "192.168.1.104"

nfs_server_export_paths:
  - path: /srv/hf-archive
    owner: casibbald
    group: casibbald
    mode: "0755"
    hf_hub: true

# ── NFSv4 server — exports ────────────────────────────────────────────────
#   192.168.1.0/24  — the home LAN (picolino, etc.). Uses `insecure` so macOS
#                     `noresvport` clients work; export still rw + all_squash.
#                     (SSH-tunneled NFS / 127.0.0.1 export retired — LAN + firewall.)
#
# Uses `sec=sys` (trust the UID/username asserted by the client) which
# is the right level for single-user LAN. Upgrade path to `sec=krb5p` when
# the LAN moves to a zero-trust posture.
#
# Also uses `all_squash,anonuid=1000,anongid=1000` — single-operator
# dev mount. Discovered during the 2026-04-20 cutover: the Mac's casibbald
# is UID 502 / gid 20 (staff), while ms02's is UID 1000 / gid 1000
# (casibbald). `sec=sys` transmits raw UIDs over the wire, so unless
# something translates them the Mac would get EACCES on every write.
# NFSv4 idmap only helps the anonymous user with sec=sys — real per-user
# translation needs sec=krb5. The server-side `all_squash` remaps every
# inbound RPC to UID 1000 regardless of source, which is correct for a
# single-user mount: writes work, reads work, and file ownership on disk
# stays consistent.
nfs_server_exports:
  - path: /home/casibbald/Workspace
    clients:
      # `insecure` — macOS mount_nfs uses non-privileged client ports (noresvport);
      # without this, direct LAN mounts fail with "RPC prog not available" / access denied.
      - cidr: 192.168.1.0/24
        options: "rw,sync,no_subtree_check,sec=sys,insecure,all_squash,anonuid=1000,anongid=1000"
      - cidr: 10.77.0.3/32
        options: "rw,sync,no_subtree_check,sec=sys,insecure,all_squash,anonuid=1000,anongid=1000"
  - path: /srv/hf-archive
    clients:
      # GB10 Sparks — hf-prefetch writes cold models here over NFS (MiniMax-M3, …).
      - cidr: 192.168.1.104/32
        options: "rw,sync,no_subtree_check,sec=sys,all_squash,anonuid=1000,anongid=1000"
      - cidr: 192.168.1.229/32
        options: "rw,sync,no_subtree_check,sec=sys,all_squash,anonuid=1000,anongid=1000"

# ── Reverse SSH tunnel → Hostinger VPS (away-from-LAN access) ─────────────
# See docs/ms02-reverse-tunnel.md and playbooks/ms02_reverse_tunnel.yml.
ms02_reverse_tunnel_enabled: true
ms02_reverse_tunnel_remote_port: 22002

# ── FAR Multipass cluster (3 × nested-KVM guests for Firecracker) ───────────
# See docs/far-multipass.md and `just far-multipass-up`.
far_multipass_vm_count: 3
far_multipass_vm_memory: 16G
far_multipass_vm_cpus: 6
far_multipass_vm_disk: 40G
