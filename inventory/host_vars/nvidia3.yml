# gx10-c113. LAN was DHCP 192.168.1.113; normalised to 192.168.1.130.
# QSFP Cage B is the live DAC (enp1s0f1np1). Cage A has no cable.
# IPv4 RoCE v2 on rocep1s0f1 is GID index 3 (show_gids 2026-10-31).
spark_nccl_ib_gid_index: "3"
spark_provision_hosts: false

# Already running the fleet pin 7.0.0-1024-nvidia (group_vars/sparks.yml).

# --- Cylon node (playbooks/cylon_node.yml; design §5.3) ---
cylon_node_name: spark3
cylon_node_slot: 3
cylon_node_lan_ip: "192.168.1.130"
# Dedicated to time-series inference (TimesFM; shared-gitops cylon-infra/timeseries).
cylon_node_extra_labels: ["cylon.microscaler.io/workload=ts-inference"]
cylon_node_extra_taints: ["cylon.microscaler.io/workload=ts-inference:NoSchedule"]
cylon_workload_images: [timesfm]
# nvidia3's LAN port negotiates 10 Mb/s (3 Nov 2026), so torch (~4 GB) is not downloaded
# here: the vector-one-train image from nvidia4 (python 3.12 + torch 2.14.1+cu130) is
# copied over the QSFP fabric into nvidia3's Docker and used as the build base.
cylon_workload_torch_base: "10.177.76.220:5000/cylon/vector-one-train:c43df5291e68"
