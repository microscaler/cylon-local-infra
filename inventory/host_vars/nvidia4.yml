# gx10-d445. LAN was DHCP 192.168.1.228; normalised to 192.168.1.140.
# QSFP Cage B is the live DAC (enp1s0f1np1). Cage A has no cable.
# IPv4 RoCE v2 on rocep1s0f1 is GID index 3 (show_gids 2026-10-31).
spark_nccl_ib_gid_index: "3"
spark_provision_hosts: false

# 7.0.0-1024-nvidia is installed; GRUB still boots 7.0.0-1019-nvidia until
# spark-kernel-apply and a reboot. Fleet pin is group_vars/sparks.yml.

# --- Cylon node (playbooks/cylon_node.yml; design §5.3) ---
cylon_node_name: spark4
cylon_node_slot: 4
cylon_node_lan_ip: "192.168.1.140"
